<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <h1>Today's list</h1>
      <p class="page__count" id="count">0 tasks</p>
    </header>

    <form class="add-row" id="add-form">
      <input
        type="text"
        id="task-input"
        class="add-row__input"
        placeholder="Add a task…"
        autocomplete="off"
        maxlength="200"
      />
      <button type="submit" class="add-row__button">Add</button>
    </form>

    <p class="error" id="error" hidden></p>

    <ul class="task-list" id="task-list"></ul>

    <p class="empty" id="empty" hidden>Nothing here yet. Add your first task above.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
